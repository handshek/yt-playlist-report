[build]
command = "pnpm build"
publish = "build/client"

# Prerendered pages are directory URLs, so keep their canonical trailing slashes.
[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/api/github-stars"
to = "/.netlify/functions/github-stars"
status = 200

[[redirects]]
from = "/playlist/*"
to = "/__spa-fallback.html"
status = 200

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/assets/*"

# Assets are content-hashed; HTML keeps Netlify's default public, max-age=0, must-revalidate policy.
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/playlist/*"

[headers.values]
X-Robots-Tag = "noindex, follow"
