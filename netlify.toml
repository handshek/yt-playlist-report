[build]
command = "pnpm build"
publish = "build/client"

# Prerendered pages are directory URLs, so keep their canonical trailing slashes.
[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/playlist/*"
to = "/__spa-fallback.html"
status = 200

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/playlist/*"

[headers.values]
X-Robots-Tag = "noindex, follow"
