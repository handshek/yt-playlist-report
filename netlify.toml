[build]
command = "pnpm build"
publish = "build/client"

# Prerendered pages are directory URLs, so keep their canonical trailing slashes.
[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/api/github-stars"
to = "/.netlify/functions/github-stars"
status = 200

[[redirects]]
from = "/api/youtube-playlist"
to = "/.netlify/functions/youtube-playlist"
status = 200

# Keep YouTube quota protection beside the rewrite Netlify applies in production.
[redirects.rate_limit]
window_limit = 30
window_size = 60
aggregate_by = ["ip", "domain"]

[[redirects]]
from = "/api/feedback"
to = "/.netlify/functions/feedback"
status = 200

# Feedback has a lower volume and a stricter free-tier abuse ceiling.
[redirects.rate_limit]
window_limit = 10
window_size = 3600
aggregate_by = ["ip", "domain"]

[[redirects]]
from = "/playlist/*"
to = "/__spa-fallback.html"
status = 200

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/assets/*"

# Assets are content-hashed; HTML keeps Netlify's default public, max-age=0, must-revalidate policy.
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/playlist/*"

[headers.values]
X-Robots-Tag = "noindex, follow"
